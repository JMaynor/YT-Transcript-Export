[project]
name = "yt-transcript-export"
version = "0.1.0"
description = "Exports transcripts from a YT channel and ingests into some database for later searching"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apprise>=1.9.3",
    "django>=5.2.4",
    "python-dotenv>=1.1.1",
    "yt-dlp[default]>=2025.6.30",
]
